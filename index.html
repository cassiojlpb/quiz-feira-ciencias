<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Roleta Histórica - 7º Ano</title>
  <style>
    :root {
      --azul: #2563eb;
      --vermelho: #dc2626;
      --verde: #16a34a;
      --amarelo: #ca8a04;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-top: 8px;
    }

    header h1 {
      font-size: 1.4rem;
      color: #fbbf24;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    header p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* Container da Roleta */
    .roulette-container {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 30px solid #f59e0b;
      z-index: 10;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.5));
    }

    canvas {
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.6), 0 0 10px rgba(251, 191, 36, 0.3);
    }

    .center-button {
      position: absolute;
      width: 68px;
      height: 68px;
      background: #f8fafc;
      color: #0f172a;
      border: 4px solid #f59e0b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      z-index: 5;
      user-select: none;
    }

    .center-button:active {
      transform: scale(0.95);
    }

    /* Legendas */
    .legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
      max-width: 340px;
      margin-bottom: 12px;
      font-size: 0.75rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 8px;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
      flex-shrink: 0;
    }

    /* Modal de Perguntas e Resultado */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-card {
      background: var(--card);
      border-radius: 18px;
      padding: 22px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .category-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .question-title {
      font-size: 1.05rem;
      line-height: 1.4;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 14px;
      text-align: left;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.15);
    }

    /* Tela de Feedback / Resultado */
    .feedback-box {
      display: none;
      text-align: center;
    }

    .feedback-icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .feedback-text {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .feedback-desc {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.4;
      background: rgba(0,0,0,0.25);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .claim-voucher {
      border: 2px dashed #fbbf24;
      background: rgba(251, 191, 36, 0.1);
      padding: 12px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .claim-voucher strong {
      color: #fbbf24;
      font-size: 1.1rem;
      display: block;
    }

    .btn-action {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      margin-top: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Roleta Histórica</h1>
    <p>Brasil Século XIX: Abolição e Exclusão Social</p>
  </header>

  <div class="roulette-container">
    <div class="pointer"></div>
    <canvas id="wheel" width="300" height="300"></canvas>
    <div class="center-button" id="spinBtn">GIRAR</div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background: var(--azul);"></div>Leis & História</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--vermelho);"></div>O Cortiço</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--verde);"></div>Imigração</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--amarelo);"></div>Abolição Inconclusa</div>
  </div>

  <!-- Modal do Quiz -->
  <div class="modal-overlay" id="quizModal">
    <div class="modal-card">
      <div id="quizContent">
        <span class="category-badge" id="catBadge">Categoria</span>
        <h2 class="question-title" id="questionText">Texto da pergunta...</h2>
        <div class="options" id="optionsBox"></div>
      </div>

      <div class="feedback-box" id="feedbackBox">
        <div class="feedback-icon" id="feedbackIcon">🎉</div>
        <div class="feedback-text" id="feedbackText">Parabéns! Você acertou!</div>
        <p class="feedback-desc" id="feedbackDesc">Explicação rápida da resposta histórica.</p>
        <div class="claim-voucher" id="voucherBox">
          <span>Mostre esta tela no stand:</span>
          <strong>🎟️ VALE 1 BRINDE HISTÓRICO</strong>
        </div>
        <button class="btn-action" id="closeBtn">Girar Novamente</button>
      </div>
    </div>
  </div>

  <script>
    /* ========================================================
       SISTEMA DE ÁUDIO VIA WEB AUDIO API (100% INDEPENDENTE)
       ======================================================== */
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Som de clique/catraca ao rodar
    function playTick() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.035);

        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.035);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.035);
      } catch (e) {}
    }

    // Som de acerto (Acorde alegre de vitória)
    function playSuccess() {
      try {
        initAudio();
        const freqs = [523.25, 659.25, 783.99, 1046.50]; // Notas Dó, Mi, Sol, Dó agudo
        freqs.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.09);

          gain.gain.setValueAtTime(0, audioCtx.currentTime + idx * 0.09);
          gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + idx * 0.09 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.09 + 0.35);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(audioCtx.currentTime + idx * 0.09);
          osc.stop(audioCtx.currentTime + idx * 0.09 + 0.38);
        });
      } catch (e) {}
    }

    // Som de erro (Som grave de erro/buzzer)
    function playError() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.3);

        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {}
    }

    /* ========================================================
       BANCO DE PERGUNTAS DO TRABALHO
       ======================================================== */
    const sectors = [
      { name: "Leis & Linha do Tempo", color: "#2563eb", textColor: "#fff" },
      { name: "O Cortiço (Bertoleza)", color: "#dc2626", textColor: "#fff" },
      { name: "Imigração e Trabalho", color: "#16a34a", textColor: "#fff" },
      { name: "Abolição Inconclusa", color: "#ca8a04", textColor: "#fff" }
    ];

    const questions = {
      0: [ // Azul
        {
          q: "Qual lei de 1850 estabeleceu que terras públicas só poderiam ser adquiridas por compra, dificultando o acesso dos futuros libertos à propriedade?",
          opts: ["Lei Áurea", "Lei de Terras", "Lei dos Sexagenários"],
          correct: 1,
          exp: "A Lei de Terras de 1850 impediu a ocupação livre e exigiu dinheiro vivo, deixando escravizados e trabalhadores pobres sem acesso à terra."
        },
        {
          q: "A assinatura da Lei Áurea em 1888 garantiu moradia, terras e educação básica para os recém-libertos?",
          opts: ["Sim, foi um plano completo", "Não, apenas declarou o fim legal sem suporte"],
          correct: 1,
          exp: "A Lei Áurea acabou legalmente com a escravidão, mas não criou medidas nem auxílios de inserção social para as famílias negras."
        }
      ],
      1: [ // Vermelho
        {
          q: "No romance 'O Cortiço' (1890), que engano cruel o comerciante João Romão praticou contra Bertoleza?",
          opts: ["Fugiu com as roupas dela", "Entregou-lhe uma falsa carta de alforria e reteve seus recursos", "Denunciou-a à polícia por roubo"],
          correct: 1,
          exp: "João Romão enganou Bertoleza com uma carta de alforria falsa para lucrar com o esforço dela enquanto enriquecia no cortiço."
        },
        {
          q: "O que a personagem fictícia Bertoleza simboliza na realidade brasileira da época?",
          opts: ["O sucesso rápido de mulheres libertas", "A exploração e desamparo vividos por mulheres negras no pós-abolição"],
          correct: 1,
          exp: "Bertoleza simboliza as pessoas cujo trabalho árduo gerava riqueza, mas que eram descartadas e desprovidas de proteção jurídica."
        }
      ],
      2: [ // Verde
        {
          q: "Por qual razão muitos proprietários e governos subsidiaram passagens e priorizaram imigrantes europeus no café?",
          opts: ["Porque negros se recusavam a trabalhar", "Por preconceito racial e políticas de branqueamento da população"],
          correct: 1,
          exp: "Havia forte preconceito racial e um projeto de branqueamento promovido pelas elites, marginalizando o trabalhador negro nacional."
        }
      ],
      3: [ // Amarelo
        {
          q: "O que significa historicamente o termo 'Abolição Inconclusa' abordado no trabalho?",
          opts: ["A lei foi revogada anos depois", "A escravidão acabou na lei, mas suas marcas de exclusão social e racismo persistem"],
          correct: 1,
          exp: "Indica que o término legal não eliminou as barreiras estruturais na educação, trabalho digno e moradia."
        }
      ]
    };

    /* ========================================================
       DESENHO E ANIMAÇÃO DA ROLETA
       ======================================================== */
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const numSectors = sectors.length;
    const arc = (2 * Math.PI) / numSectors;

    let currentAngle = 0;
    let isSpinning = false;
    let lastTickAngle = 0;

    function drawWheel() {
      const radius = canvas.width / 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numSectors; i++) {
        const angle = currentAngle + i * arc;
        ctx.beginPath();
        ctx.fillStyle = sectors[i].color;
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, angle, angle + arc);
        ctx.fill();
        ctx.stroke();

        // Rótulos
        ctx.save();
        ctx.fillStyle = sectors[i].textColor;
        ctx.font = "bold 13px sans-serif";
        ctx.translate(radius, radius);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = "right";
        ctx.fillText(sectors[i].name, radius - 15, 5);
        ctx.restore();
      }
    }

    drawWheel();

    function spin() {
      if (isSpinning) return;
      initAudio();
      isSpinning = true;

      const spinRounds = 4 + Math.random() * 3; // 4 a 7 voltas
      const extraAngle = Math.random() * 2 * Math.PI;
      const totalRotation = spinRounds * 2 * Math.PI + extraAngle;
      
      const duration = 4000;
      const startTime = performance.now();
      const initialAngle = currentAngle;
      lastTickAngle = initialAngle;

      function animate(time) {
        const elapsed = time - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // Easing cúbico para desaceleração realista
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = initialAngle + totalRotation * easeOut;

        // Disparo do som de rotação (a cada fração de setor percorrida)
        if (Math.abs(currentAngle - lastTickAngle) > arc / 2) {
          playTick();
          lastTickAngle = currentAngle;
        }

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          determineWinner();
        }
      }

      requestAnimationFrame(animate);
    }

    spinBtn.addEventListener("click", spin);

    function determineWinner() {
      // Cálculo do ponteiro no topo (3 * PI / 2 radianos ou 270 graus)
      const normalizedAngle = (currentAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      const pointerAngle = (3 * Math.PI / 2 - normalizedAngle + 2 * Math.PI) % (2 * Math.PI);
      const winnerIndex = Math.floor(pointerAngle / arc) % numSectors;

      showQuestion(winnerIndex);
    }

    /* ========================================================
       LÓGICA DO MODAL E DO QUIZ
       ======================================================== */
    const modal = document.getElementById("quizModal");
    const quizContent = document.getElementById("quizContent");
    const feedbackBox = document.getElementById("feedbackBox");
    const catBadge = document.getElementById("catBadge");
    const questionText = document.getElementById("questionText");
    const optionsBox = document.getElementById("optionsBox");

    function showQuestion(sectorIdx) {
      const sector = sectors[sectorIdx];
      const sectorQuestions = questions[sectorIdx];
      const qData = sectorQuestions[Math.floor(Math.random() * sectorQuestions.length)];

      catBadge.textContent = sector.name;
      catBadge.style.backgroundColor = sector.color;
      catBadge.style.color = sector.textColor;

      questionText.textContent = qData.q;
      optionsBox.innerHTML = "";

      qData.opts.forEach((optText, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = optText;
        btn.onclick = () => checkAnswer(index === qData.correct, qData.exp);
        optionsBox.appendChild(btn);
      });

      quizContent.style.display = "block";
      feedbackBox.style.display = "none";
      modal.style.display = "flex";
    }

    function checkAnswer(isCorrect, explanation) {
      quizContent.style.display = "none";
      feedbackBox.style.display = "block";

      const icon = document.getElementById("feedbackIcon");
      const title = document.getElementById("feedbackText");
      const desc = document.getElementById("feedbackDesc");
      const voucher = document.getElementById("voucherBox");

      desc.textContent = explanation;

      if (isCorrect) {
        playSuccess(); // Toca áudio de vitória
        icon.textContent = "🎉";
        title.textContent = "Excelente! Você acertou!";
        title.style.color = "#4ade80";
        voucher.style.display = "block";
      } else {
        playError(); // Toca áudio de erro
        icon.textContent = "💡";
        title.textContent = "Quase lá! Veja a explicação:";
        title.style.color = "#f87171";
        voucher.style.display = "none";
      }
    }

    document.getElementById("closeBtn").addEventListener("click", () => {
      modal.style.display = "none";
    });
  </script>
</body>
</html>
