<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roleta Histórica - Feira de Ciências</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM (Development) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel para compilar JSX no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Canvas Confetti para animação de vitória -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Ajuste do gradiente cônico da roleta */
        .wheel-gradient {
            background: conic-gradient(
                #3B82F6 0deg 90deg,   /* Azul */
                #EF4444 90deg 180deg, /* Vermelho */
                #10B981 180deg 270deg, /* Verde */
                #F59E0B 270deg 360deg /* Amarelo */
            );
        }

        .bg-pattern {
            background-color: #ffffff;
            opacity: 1;
            background-image:  radial-gradient(#e5e7eb 1px, transparent 1px), radial-gradient(#e5e7eb 1px, #ffffff 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
    </style>
</head>
<body class="bg-pattern min-h-screen flex items-center justify-center p-4">

    <!-- Container do App React -->
    <div id="root" class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden relative min-h-[600px] flex flex-col border border-gray-100"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Base de Dados de Perguntas
        const questions = [
            { 
                id: 0, 
                colorClass: 'bg-blue-500', 
                textClass: 'text-blue-600',
                borderClass: 'border-blue-200',
                name: 'Legislação e Linha do Tempo', 
                q: 'Qual lei aprovada em 1850 determinou que a terra pública só poderia ser adquirida por compra?', 
                options: ['Lei Áurea', 'Lei de Terras', 'Lei dos Sexagenários'], 
                correct: 1, 
                explanation: 'Dificultou a autonomia das famílias que viriam a ser libertadas anos depois.' 
            },
            { 
                id: 1, 
                colorClass: 'bg-red-500', 
                textClass: 'text-red-600',
                borderClass: 'border-red-200',
                name: 'Literatura e O Cortiço', 
                q: 'No romance O Cortiço (1890), que engano João Romão aplica contra a trabalhadora Bertoleza?', 
                options: ['Fingiu ser seu advogado', 'Entregou uma falsa carta de alforria e reteve o dinheiro dela', 'Roubou sua certidão de nascimento'], 
                correct: 1, 
                explanation: 'Bertoleza representa a vulnerabilidade extrema de mulheres negras na época.' 
            },
            { 
                id: 2, 
                colorClass: 'bg-green-500', 
                textClass: 'text-green-600',
                borderClass: 'border-green-200',
                name: 'Imigração e Trabalho', 
                q: 'Verdadeiro ou Falso: Todos os imigrantes enriqueceram rapidamente, enquanto os negros foram proibidos de trabalhar.', 
                options: ['Verdadeiro', 'Falso'], 
                correct: 1, 
                explanation: 'Muitos imigrantes enfrentaram dívidas severas, mas contavam com incentivos governamentais e prioridade nas contratações.' 
            },
            { 
                id: 3, 
                colorClass: 'bg-yellow-500', 
                textClass: 'text-yellow-600',
                borderClass: 'border-yellow-200',
                name: 'Abolição Inconclusa', 
                q: 'O que significa o conceito histórico de "Abolição Inconclusa"?', 
                options: ['Que a escravidão nunca terminou na lei.', 'O fim da escravidão não foi seguido por igualdade real de condições.', 'Que a Princesa Isabel assinou o documento errado.'], 
                correct: 1, 
                explanation: 'Sem políticas de reparação, muitas desigualdades se mantiveram ao longo das gerações.' 
            }
        ];

        function App() {
            const [gameState, setGameState] = useState('home'); // home, spinning, question, feedback
            const [rotation, setRotation] = useState(0);
            const [currentCat, setCurrentCat] = useState(null);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [isCorrect, setIsCorrect] = useState(false);

            const spinWheel = () => {
                if (gameState === 'spinning') return;
                setGameState('spinning');
                
                // Escolhe categoria aleatória (0 a 3)
                const randomIdx = Math.floor(Math.random() * questions.length);
                
                // Cálculo matemático para a roleta parar exatamente na cor certa
                // Cores: 0:Azul(0-90), 1:Vermelho(90-180), 2:Verde(180-270), 3:Amarelo(270-360)
                // O ponteiro fica no topo (0 graus).
                const targetAngles = [315, 225, 135, 45]; // Centro de cada fatia para o topo
                const baseAngle = targetAngles[randomIdx];
                
                // Adiciona 5 voltas completas (1800 graus) + ajuste para a cor + variação aleatória de segurança
                const spins = 360 * 5;
                const newRotation = rotation + spins + (baseAngle - (rotation % 360));
                
                setRotation(newRotation);

                // Espera a animação do CSS terminar (3 segundos)
                setTimeout(() => {
                    setCurrentCat(questions[randomIdx]);
                    setGameState('question');
                }, 3000);
            };

            const handleAnswer = (index) => {
                setSelectedAnswer(index);
                const correct = index === currentCat.correct;
                setIsCorrect(correct);
                setGameState('feedback');

                if (correct) {
                    triggerConfetti();
                }
            };

            const triggerConfetti = () => {
                const duration = 3 * 1000;
                const animationEnd = Date.now() + duration;
                const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

                const interval = setInterval(function() {
                    const timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) return clearInterval(interval);
                    const particleCount = 50 * (timeLeft / duration);
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
                }, 250);
            };

            const randomInRange = (min, max) => Math.random() * (max - min) + min;

            const resetGame = () => {
                setGameState('home');
                setSelectedAnswer(null);
                setCurrentCat(null);
                // Não reseta a rotação para que a próxima girada continue de onde parou
            };

            return (
                <div className="flex flex-col h-full w-full relative">
                    
                    {/* Header Padrão */}
                    <div className="bg-gray-900 text-white p-5 text-center rounded-t-3xl shadow-sm">
                        <h1 className="text-xl font-bold tracking-tight">Roleta Histórica</h1>
                        <p className="text-xs text-gray-400 mt-1 uppercase tracking-wider font-semibold">Grupo 4 - Abolição e Exclusão</p>
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center p-6 pb-8">
                        
                        {/* TELA DA ROLETA */}
                        {(gameState === 'home' || gameState === 'spinning') && (
                            <div className="w-full flex flex-col items-center animate-fade-in">
                                <h2 className="text-center text-gray-800 font-semibold mb-8 text-lg">
                                    Gire a roleta para sortear seu desafio!
                                </h2>

                                <div className="relative w-64 h-64 mb-10">
                                    {/* Ponteiro */}
                                    <div className="absolute top-0 left-1/2 -translate-x-1/2 -mt-3 w-0 h-0 border-l-[12px] border-r-[12px] border-t-[24px] border-l-transparent border-r-transparent border-t-gray-900 z-20 drop-shadow-lg"></div>
                                    
                                    {/* Roda */}
                                    <div 
                                        className="w-full h-full rounded-full border-[6px] border-gray-900 shadow-2xl wheel-gradient"
                                        style={{
                                            transform: `rotate(${rotation}deg)`,
                                            transition: gameState === 'spinning' ? 'transform 3s cubic-bezier(0.25, 0.1, 0.25, 1)' : 'none'
                                        }}
                                    ></div>
                                    
                                    {/* Centro da Roleta */}
                                    <div className="absolute inset-0 m-auto w-14 h-14 bg-gray-900 rounded-full border-[4px] border-white z-10 shadow-inner flex items-center justify-center">
                                        <div className="w-4 h-4 bg-gray-300 rounded-full shadow-inner"></div>
                                    </div>
                                </div>

                                <button 
                                    onClick={spinWheel}
                                    disabled={gameState === 'spinning'}
                                    className={`w-full py-4 rounded-2xl font-bold text-lg shadow-lg text-white transition-all active:scale-95 ${gameState === 'spinning' ? 'bg-gray-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}
                                >
                                    {gameState === 'spinning' ? 'Girando...' : 'GIRAR A ROLETA'}
                                </button>
                            </div>
                        )}

                        {/* TELA DA PERGUNTA */}
                        {gameState === 'question' && currentCat && (
                            <div className="w-full flex flex-col animate-fade-in">
                                <div className={`inline-block px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider mb-6 self-start text-white shadow-sm ${currentCat.colorClass}`}>
                                    {currentCat.name}
                                </div>
                                
                                <h3 className="text-xl font-bold text-gray-800 mb-8 leading-snug">
                                    {currentCat.q}
                                </h3>

                                <div className="space-y-3 w-full">
                                    {currentCat.options.map((opt, idx) => (
                                        <button 
                                            key={idx}
                                            onClick={() => handleAnswer(idx)}
                                            className="w-full text-left p-4 rounded-xl border-2 border-gray-200 hover:border-gray-400 hover:bg-gray-50 active:bg-gray-100 transition-colors font-medium text-gray-700 shadow-sm"
                                        >
                                            {opt}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TELA DE RESULTADO */}
                        {gameState === 'feedback' && currentCat && (
                            <div className="w-full flex flex-col animate-fade-in h-full justify-center">
                                {isCorrect ? (
                                    <div className="text-center">
                                        <div className="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                            <svg className="w-12 h-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                                        </div>
                                        <h2 className="text-3xl font-extrabold text-green-600 mb-2">Acertou!</h2>
                                        <p className="text-gray-600 mb-8 font-medium">Você mandou muito bem.</p>
                                        
                                        <div className="bg-gradient-to-r from-yellow-100 to-yellow-50 border-2 border-yellow-400 p-6 rounded-2xl shadow-md mb-8 transform scale-105">
                                            <p className="text-yellow-800 font-bold text-lg leading-snug">
                                                🎉 Mostre esta tela no stand para retirar seu brinde!
                                            </p>
                                        </div>

                                        <button onClick={resetGame} className="w-full py-4 rounded-xl font-bold text-lg bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors">
                                            Voltar ao Início
                                        </button>
                                    </div>
                                ) : (
                                    <div className="text-center">
                                        <div className="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                            <svg className="w-10 h-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                                        </div>
                                        <h2 className="text-2xl font-bold text-red-600 mb-2">Poxa, resposta incorreta.</h2>
                                        
                                        <div className={`mt-6 text-left p-5 rounded-2xl border-l-4 ${currentCat.borderClass} bg-white shadow-md`}>
                                            <p className="text-sm text-gray-500 font-semibold uppercase tracking-wider mb-1">A resposta certa é:</p>
                                            <p className={`font-bold mb-4 ${currentCat.textClass}`}>
                                                {currentCat.options[currentCat.correct]}
                                            </p>
                                            <div className="h-px w-full bg-gray-100 mb-4"></div>
                                            <p className="text-sm text-gray-700 leading-relaxed">
                                                <span className="font-semibold">Contexto Histórico: </span> 
                                                {currentCat.explanation}
                                            </p>
                                        </div>

                                        <button onClick={resetGame} className="w-full mt-8 py-4 rounded-xl font-bold text-lg bg-gray-900 text-white shadow-lg hover:bg-gray-800 transition-colors active:scale-95">
                                            Tentar Novamente
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <style>
        /* Animação suave de entrada para as telas */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</body>
</html>
